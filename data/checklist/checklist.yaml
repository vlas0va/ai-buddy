# Чек-лист стажёра Авито, разобранный по ролям и сценариям AI-buddy.
# Источник: avito-intern-checklist.csv (выгрузка из таблицы, указанной в ТЗ). Формулировки пунктов — как в источнике.
# role: intern | mentor (бадди/руководитель) | both. Роль выведена из формулировки пункта: «добавь стажёра…» — наставник, «попроси добавить себя…» — стажёр.
# human_only: buddy только напоминает и помогает подготовиться, сам пункт выполняют люди (R05).
# Сиды mcp-checklist строятся из этого файла.

periods:
  - {id: week_1, label: "1 неделя"}
  - {id: week_2, label: "2 неделя"}
  - {id: month_1, label: "1 месяц"}
  - {id: month_2, label: "2 месяц"}
  - {id: after_3_months, label: "После 3-х месяцев"}

items:
  - id: CL-01
    role: mentor
    period: week_1
    title: "Организационные моменты"
    steps:
      - "Добавь стажёра во все необходимые чаты и каналы, в том числе в закрытые"
      - "Проверь, запросил ли стажёр доступы ко всем необходимым программам, инструментам и пространствам (Confluence, Jira и т. д.)"
      - "Назначь со стажёром регулярные 1:1, на которых будешь рассказывать об особенностях работы в команде, инструментах, задачах и т. д."
      - "Обсуди цели и план на период адаптации, критерии успешного прохождения стажировки. Расскажи про целеполагание в команде и планы на ближайший период (OKR)"
    scenarios: [S1, S4]
    buddy: "Наставник видит, какие доступы и каналы стажёр уже запросил (S4); цели и критерии вносит в план стажёра (S1); напоминание назначить 1:1"
    human_only: false

  - id: CL-02
    role: mentor
    period: week_1
    title: "Запроси у куратора стажировки методичку наставника"
    scenarios: [S2]
    buddy: "Черновик сообщения куратору стажировки; контакт куратора из справочника"
    human_only: false

  - id: CL-03
    role: intern
    period: week_1
    title: "Познакомься с командой, с которой будешь работать"
    scenarios: [S2]
    buddy: "Кто есть кто в команде и к кому с чем идти (справочник)"
    human_only: true

  - id: CL-04
    role: intern
    period: week_1
    title: "Работа с наставником"
    steps:
      - "Попроси добавить себя во все ключевые каналы и чаты"
      - "Обсуди с наставником встречи, на которых ты побывал(а), и задай возникшие вопросы"
      - "Заведи конспект, в котором будешь фиксировать информацию со встреч с наставником: общую информацию о компании, обратную связь по твоей работе и т.п."
    scenarios: [S2, S4]
    buddy: "Список каналов команды и черновик просьбы наставнику (S4); вопросы по встречам (S2); конспект встреч — опционально, приватные заметки"
    human_only: false

  - id: CL-05
    role: intern
    period: week_1
    title: "Запроси доступ в пространство своего кластера и/или команды и изучи его/их"
    scenarios: [S4, S2]
    buddy: "Заявка на доступ через сервис доступов (S4), затем ответы по содержимому пространства (S2)"
    human_only: false

  - id: CL-06
    role: mentor
    period: week_2
    title: "Запроси у куратора инструмент для отслеживания прогресса стажера. Внеси в него цели, задачи и ожидания"
    scenarios: [S1]
    buddy: "В прототипе этот инструмент — план адаптации S1: наставник или руководитель вносит цели, задачи и ожидания"
    human_only: false

  - id: CL-07
    role: intern
    period: week_2
    title: "Изучи все необходимые документы и мануалы по работе в своей команде/вертикали/кластеру, которыми с тобой поделился бадди/руководитель"
    scenarios: [S2, S1]
    buddy: "Ответы по базе знаний команды со ссылкой на источник; задача в плане"
    human_only: false

  - id: CL-08
    role: intern
    period: month_1
    title: "Изучи основы защиты персональных данных и другие инструкции Авито"
    steps:
      - "Ознакомься с лендингом «Защита данных»"
      - "Ознакомься с памяткой по раскрытию информации"
      - "Ознакомься с политикой по работе с КИ и ее защите"
    scenarios: [S1, S2]
    buddy: "Напоминание и отметка в плане; отвечает только по синтетическим тестовым версиям с плашкой и отсылает к официальным документам (R69)"
    human_only: false

  - id: CL-09
    role: intern
    period: month_2
    title: "Изучи памятку, как закрывать практику, писать учебные работы по Авито"
    scenarios: [S2, S1]
    buddy: "Ответы по тестовой версии памятки; к куратору — если вопрос о документах для вуза"
    human_only: false

  - id: CL-10
    role: intern
    period: after_3_months
    title: "Подготовься к экваторной встрече"
    steps:
      - "Сходи на мастер-классы для подготовки к экваторной встрече (приглашения будут в календаре)"
      - "Для подготовки презентации можно посмотреть запись мастер-класса «Как и где создавать красивые презентации»"
      - "Для подготовки речи выступления можно посмотреть онлайн-курс «Как оптимизировать коммуникацию, чтобы тебя все понимали», курс «Учимся выступать публично (Радислав Гандапас)»"
    scenarios: [S1]
    buddy: "Напоминания ИИ-крона и список материалов для подготовки"
    human_only: false

  - id: CL-11
    role: intern
    period: after_3_months
    title: "Экваторная встреча"
    steps:
      - "К выступлению на экваторе оформи презентацию по заданной структуре и подготовь речь"
      - "Согласуй презентацию с промежуточными результатами с куратором стажировки и бадди/руководителем. При необходимости внеси корректировки"
      - "При необходимости попроси куратора стажировки или своего бадди/руководителя провести с тобой репетицию выступления"
      - "Обязательно сходи на экваторную встречу и представь свои промежуточные результаты. Опционально можешь посетить экваторные встречи других стажёров"
      - "Прими участие во встрече с подведением итогов после экваторных встреч (приглашение будет в календаре)"
    scenarios: [S1, S2]
    buddy: "Пошаговый чек-лист подготовки, сводка выполненных задач плана для презентации, черновик просьбы о репетиции; само выступление — за стажёром"
    human_only: false

  - id: CL-12
    role: mentor
    period: after_3_months
    title: "На 1:1 обсуди со стажёром промежуточные итоги стажировки, дай обратную связь по его прогрессу и результатам относительно целей"
    scenarios: [S1]
    buddy: "Только напоминание и сводка прогресса по плану; обратную связь даёт наставник"
    human_only: true

  - id: CL-13
    role: mentor
    period: after_3_months
    title: "Экваторная встреча (для бадди и руководителя)"
    steps:
      - "Сходи на бриф для бадди и руководителей перед экваторной встречей (приглашение будет в календаре)"
      - "Проверь презентацию стажёра: в ней должны быть корректно отражены выполненные задачи и цели на стажировку. При необходимости внеси правки (презентацию стажёр готовит самостоятельно, а с оформлением ему помогает куратор стажировки)"
      - "Если стажёр попросит провести репетицию выступления по презентации, поддержи его и назначь встречу на 15 минут"
      - "Подготовь напутственное слово для своего стажёра на экваторную встречу. Это не обратная связь, а возможность поблагодарить стажёра за проделанную работу и поделиться пожеланиями на оставшийся период стажировки"
      - "Посети экваторную встречу своего стажёра (приглашение будет в календаре)"
    scenarios: [S1]
    buddy: "Напоминания наставнику и сводка выполненных задач и целей стажёра для проверки презентации"
    human_only: true

  - id: CL-14
    role: both
    period: after_3_months
    title: "Выпускной"
    description: "Приходи на выпускной! Все детали будут в приглашении в календаре. С вопросами можешь обратиться к своему куратору стажировки"
    scenarios: [S1, S2]
    buddy: "Напоминание; вопросы направляет к куратору стажировки; после выпускного buddy остаётся точкой входа (R58)"
    human_only: true

  - id: CL-15
    role: intern
    period: after_3_months
    title: "Пройди опрос о том, как прошла стажировка"
    scenarios: [S1]
    buddy: "Напоминание; результаты опроса — источник данных для оценки эффекта пилота (R25)"
    human_only: true

  - id: CL-16
    role: mentor
    period: after_3_months
    title: "Пройди опрос о том, как прошла стажировка"
    scenarios: [S1]
    buddy: "Напоминание наставнику; в источнике пункт продублирован — считаем его версией для наставника"
    human_only: true

# gitleaks (задача CI secrets, v8.21.2). Правила по умолчанию плюс белый список синтетических тестовых секретов:
# Go-тесты и тестовые фикстуры подписывают JWT и токены подтверждения выдуманными ключами. Реальные секреты живут только
# в .env (не в git).
[extend]
useDefault = true

[allowlist]
description = "Synthetic secrets in tests and fixtures"
paths = [
  '''_test\.go$''',
  '''(^|/)testdata/''',
  '''^services/agent/tests/''',
]

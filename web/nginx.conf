server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Файлы сборки с хешем в имени не меняются — браузер кэширует их надолго.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html браузер проверяет при каждом заходе, иначе после обновления стенда открывается старая версия сайта.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

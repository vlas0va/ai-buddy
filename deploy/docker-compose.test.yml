# Disposable Postgres for Go tests (scripts/test-db.sh). Data lives in tmpfs and disappears on `down`.
name: aibuddy-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: buddy
      POSTGRES_PASSWORD: buddy
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U buddy"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

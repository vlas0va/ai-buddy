# AI-buddy stack. Run from the repo root:
#   docker compose -f deploy/docker-compose.yml --profile core up -d --build        (make up)
#   KAFKA_BROKERS=kafka:9092 docker compose -f deploy/docker-compose.yml --profile full up -d --build   (make up-full)
# Web: http://localhost:5173, core API: http://localhost:8080. Details: docs/backend/README.md
name: aibuddy

x-core-secrets: &secrets
  JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret}
  CONFIRMATION_HMAC_SECRET: ${CONFIRMATION_HMAC_SECRET:-local-dev-only-hmac-secret}

services:
  postgres:
    image: postgres:16-alpine
    profiles: [core, full]
    environment:
      POSTGRES_DB: buddy
      POSTGRES_USER: buddy
      POSTGRES_PASSWORD: buddy
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check on purpose: during first init the temporary server listens only on the socket,
      # so the service turns healthy only after migrations and seed are applied.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U buddy -d buddy"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    profiles: [core, full]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp-mocks:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        CMD: mcp-mocks
    profiles: [core, full]
    env_file:
      - path: ../.env
        required: false
    environment:
      <<: *secrets
      MCP_MOCKS_PORT: "8100"
      POSTGRES_URL: postgres://buddy:buddy@postgres:5432/buddy?sslmode=disable
      KB_DIR: /app/data/kb
    volumes:
      - ../data/kb:/app/data/kb:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/app", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:8100:8100"   # debug and local agent development; the agent reaches it inside the compose network

  core:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        CMD: core
    profiles: [core, full]
    env_file:
      - path: ../.env
        required: false
    environment:
      <<: *secrets
      CORE_PORT: "8080"   # in-container port is fixed; change the host side with CORE_HOST_PORT
      POSTGRES_URL: postgres://buddy:buddy@postgres:5432/buddy?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AGENT_URL: ${AGENT_URL:-http://agent:8090}
      MCP_BASE_URL: ${MCP_BASE_URL:-http://mcp-mocks:8100/mcp}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Empty = Kafka off (events only go to core.analytics_events). Profile full: run with
      # KAFKA_BROKERS=kafka:9092 (shell variable, see docs/backend/README.md).
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-mocks:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/app", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "${CORE_HOST_PORT:-8080}:8080"

  agent:
    # Owner A. AI agent: Flask + SSE, stub LLM by default (works without any key), MCP tools by role (ADR-001..008).
    build:
      context: ..
      dockerfile: services/agent/Dockerfile
    profiles: [core, full]
    env_file:
      - path: ../.env
        required: false
    environment:
      AGENT_PORT: "8090"
      # the image has the KB and the checklist at /data (Dockerfile); a KB_DIR from ../.env (mcp-mocks' /app/data/kb)
      # must not leave the agent with an empty local KB copy (no source documents, weaker ranking)
      KB_DIR: /data/kb
      CHECKLIST_PATH: /data/checklist/checklist.yaml
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret}
      CONFIRMATION_HMAC_SECRET: ${CONFIRMATION_HMAC_SECRET:-local-dev-only-hmac-secret}
      REDIS_URL: redis://redis:6379/1
      AGENT_USE_REDIS: "true"
      # B's eight MCP servers (one binary mcp-mocks). The agent's in-process mocks stay for `make agent-dev` and its tests.
      MCP_BASE_URL: ${MCP_BASE_URL:-http://mcp-mocks:8100/mcp}
      # Web search for general technical questions: curated (default, offline) | searxng (profile websearch) | off.
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-curated}
      WEB_SEARCH_URL: ${WEB_SEARCH_URL:-}
      # A-Vibe by default (Rita 12.11): the bundled Ollama serves it; a LLM_* line in ../.env overrides these defaults.
      # Until Ollama has downloaded the model, and whenever it fails or is too slow, the agent answers with the stub.
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-openai_compat}
      LLM_DEFAULT_BASE_URL: ${LLM_DEFAULT_BASE_URL:-http://ollama:11434/v1}
      LLM_DEFAULT_MODEL: ${AVIBE_MODEL:-hf.co/NightForger/avibe-GGUF:Q4_K_M}
      LLM_DEFAULT_TIMEOUT_S: ${LLM_DEFAULT_TIMEOUT_S:-120}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Ollama running on the laptop itself (A-Vibe on the laptop GPU)
    depends_on:
      redis:
        condition: service_healthy
      mcp-mocks:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${AGENT_HOST_PORT:-8090}:8090"   # debug only; core reaches it at http://agent:8090

  searxng:
    # Optional live web search: docker compose -f deploy/docker-compose.yml --profile core --profile websearch up -d
    # and in .env: WEB_SEARCH_PROVIDER=searxng WEB_SEARCH_URL=http://searxng:8080
    image: searxng/searxng:latest
    profiles: [websearch]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-dev-only-searxng-secret}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  ollama:
    # A-Vibe (AvitoTech/avibe, GGUF Q4_K_M, ~5 GB) for the agent by default, no key. On the first start the model is
    # downloaded in the background (the stack is ready at once, the agent uses the stub until the model is there).
    # CPU by default; NVIDIA GPU: add -f deploy/docker-compose.gpu.yml. No download: AVIBE_PULL=false.
    image: ollama/ollama:0.9.6
    profiles: [core, full, ollama]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama serve & pid=$$!; sleep 3;
        if [ "$$AVIBE_PULL" != "false" ]; then
        until ollama pull "$$AVIBE_MODEL"; do echo "A-Vibe download failed, retry in 60 s"; sleep 60; done; fi;
        wait $$pid
    environment:
      AVIBE_MODEL: ${AVIBE_MODEL:-hf.co/NightForger/avibe-GGUF:Q4_K_M}
      AVIBE_PULL: ${AVIBE_PULL:-true}
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}   # the prompt carries whole KB documents
    volumes:
      - ollama:/root/.ollama

  avibe:
    # Optional own-compute LLM: A-Vibe (AvitoTech/avibe, 8B, Apache-2.0) served by vLLM, OpenAI-compatible, with tool calling.
    #   docker compose -f deploy/docker-compose.yml --profile core --profile avibe up -d
    #   .env: LLM_PROVIDER=openai_compat LLM_BASE_URL=http://avibe:8000/v1 LLM_MODEL=AvitoTech/avibe LLM_TIMEOUT_S=60
    # Needs an NVIDIA GPU (~23 GB VRAM in 16-bit; AVIBE_QUANTIZATION=fp8 halves it on Ada/Hopper) and the NVIDIA runtime.
    image: vllm/vllm-openai:v0.10.1.1
    profiles: [avibe]
    command:
      - --model=AvitoTech/avibe
      - --served-model-name=AvitoTech/avibe
      - --max-model-len=${AVIBE_MAX_LEN:-8192}
      - --gpu-memory-utilization=0.90
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
      - ${AVIBE_QUANTIZATION_FLAG:---dtype=auto}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "127.0.0.1:8000:8000"

  web:
    # Owner C. SPA served by nginx. VITE_API_BASE_URL is a BUILD-time value: the browser calls core directly, so it must
    # match the host port of core, and the web origin must be in core's CORS_ORIGINS (default http://localhost:5173).
    build:
      context: ../web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    profiles: [core, full]
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "${WEB_HOST_PORT:-5173}:80"

  kafka:
    image: apache/kafka:3.9.0
    profiles: [full]
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [full]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ai-buddy.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
  ollama:
  hf-cache:

# Стек AI-buddy. Запуск из корня репозитория:
#   docker compose -f deploy/docker-compose.yml --profile core up -d --build        (make up)
#   KAFKA_BROKERS=kafka:9092 docker compose -f deploy/docker-compose.yml --profile full up -d --build   (make up-full)
# Веб: http://localhost:5173, API ядра: http://localhost:8080. Подробности: docs/backend/README.md
name: aibuddy

x-core-secrets: &secrets
  JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret}
  CONFIRMATION_HMAC_SECRET: ${CONFIRMATION_HMAC_SECRET:-local-dev-only-hmac-secret}

services:
  postgres:
    image: postgres:16-alpine
    profiles: [core, full]
    environment:
      POSTGRES_DB: buddy
      POSTGRES_USER: buddy
      POSTGRES_PASSWORD: buddy
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Проверка по TCP намеренно: во время первой инициализации временный сервер слушает только сокет, поэтому сервис
      # становится здоровым только после применения миграций и демо-данных.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U buddy -d buddy"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    profiles: [core, full]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mcp-mocks:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        CMD: mcp-mocks
    profiles: [core, full]
    env_file:
      - path: ../.env
        required: false
    environment:
      <<: *secrets
      MCP_MOCKS_PORT: "8100"
      POSTGRES_URL: postgres://buddy:buddy@postgres:5432/buddy?sslmode=disable
      KB_DIR: /app/data/kb
    volumes:
      - ../data/kb:/app/data/kb:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/app", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "127.0.0.1:8100:8100"   # отладка и локальная разработка агента; агент обращается к нему внутри сети compose

  core:
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        CMD: core
    profiles: [core, full]
    env_file:
      - path: ../.env
        required: false
    environment:
      <<: *secrets
      CORE_PORT: "8080"   # порт внутри контейнера фиксирован; сторону хоста меняет CORE_HOST_PORT
      POSTGRES_URL: postgres://buddy:buddy@postgres:5432/buddy?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      AGENT_URL: ${AGENT_URL:-http://agent:8090}
      MCP_BASE_URL: ${MCP_BASE_URL:-http://mcp-mocks:8100/mcp}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # Пусто — Kafka выключена (события идут только в core.analytics_events). Профиль full: запускайте с
      # KAFKA_BROKERS=kafka:9092 (переменная оболочки, см. docs/backend/README.md).
      KAFKA_BROKERS: ${KAFKA_BROKERS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mcp-mocks:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/app", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    ports:
      - "${CORE_HOST_PORT:-8080}:8080"

  agent:
    # Владелец A. ИИ-агент: Flask + SSE, по умолчанию stub-LLM (работает без ключа), инструменты MCP по ролям
    # (ADR-001..008).
    build:
      context: ..
      dockerfile: services/agent/Dockerfile
    profiles: [core, full]
    env_file:
      - path: ../.env
        required: false
    environment:
      AGENT_PORT: "8090"
      # в образе база знаний и чек-лист лежат в /data (Dockerfile); KB_DIR из ../.env (путь mcp-mocks /app/data/kb) не
      # должен оставлять агента с пустой локальной копией базы знаний (без исходных документов, ранжирование хуже)
      KB_DIR: /data/kb
      CHECKLIST_PATH: /data/checklist/checklist.yaml
      JWT_SECRET: ${JWT_SECRET:-local-dev-only-jwt-secret}
      CONFIRMATION_HMAC_SECRET: ${CONFIRMATION_HMAC_SECRET:-local-dev-only-hmac-secret}
      REDIS_URL: redis://redis:6379/1
      AGENT_USE_REDIS: "true"
      # Восемь MCP-серверов B (один бинарник mcp-mocks). Моки агента в процессе остаются для `make agent-dev` и его
      # тестов.
      MCP_BASE_URL: ${MCP_BASE_URL:-http://mcp-mocks:8100/mcp}
      # Веб-поиск по общим техническим вопросам: curated (по умолчанию, без сети) | searxng (профиль websearch) | off.
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-curated}
      WEB_SEARCH_URL: ${WEB_SEARCH_URL:-}
      # A-Vibe по умолчанию (Рита 12.11): её обслуживает встроенная Ollama; строка LLM_* в ../.env переопределяет эти
      # значения. Пока Ollama не скачала модель, а также когда она сбоит или слишком медленная, агент отвечает через
      # stub.
      LLM_DEFAULT_PROVIDER: ${LLM_DEFAULT_PROVIDER:-openai_compat}
      LLM_DEFAULT_BASE_URL: ${LLM_DEFAULT_BASE_URL:-http://ollama:11434/v1}
      LLM_DEFAULT_MODEL: ${AVIBE_MODEL:-hf.co/NightForger/avibe-GGUF:Q4_K_M}
      LLM_DEFAULT_TIMEOUT_S: ${LLM_DEFAULT_TIMEOUT_S:-120}
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Ollama, запущенная на самом ноутбуке (A-Vibe на GPU ноутбука)
    depends_on:
      redis:
        condition: service_healthy
      mcp-mocks:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${AGENT_HOST_PORT:-8090}:8090"   # только для отладки; ядро обращается к нему по http://agent:8090

  searxng:
    # Необязательный живой веб-поиск:
    #   docker compose -f deploy/docker-compose.yml --profile core --profile websearch up -d
    # и в .env: WEB_SEARCH_PROVIDER=searxng WEB_SEARCH_URL=http://searxng:8080
    image: searxng/searxng:latest
    profiles: [websearch]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-local-dev-only-searxng-secret}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  ollama:
    # A-Vibe (AvitoTech/avibe, GGUF Q4_K_M, ~5 ГБ) для агента по умолчанию, без ключа. При первом запуске модель
    # скачивается в фоне (стек готов сразу, агент использует stub, пока модели нет). По умолчанию CPU; NVIDIA GPU:
    # добавьте -f deploy/docker-compose.gpu.yml. Без скачивания: AVIBE_PULL=false.
    image: ollama/ollama:0.9.6
    profiles: [core, full, ollama]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        ollama serve & pid=$$!; sleep 3;
        if [ "$$AVIBE_PULL" != "false" ]; then
        until ollama pull "$$AVIBE_MODEL"; do echo "A-Vibe download failed, retry in 60 s"; sleep 60; done; fi;
        wait $$pid
    environment:
      AVIBE_MODEL: ${AVIBE_MODEL:-hf.co/NightForger/avibe-GGUF:Q4_K_M}
      AVIBE_PULL: ${AVIBE_PULL:-true}
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-8192}   # в промпт попадают документы базы знаний целиком
    volumes:
      - ollama:/root/.ollama

  avibe:
    # Необязательная LLM на своих мощностях: A-Vibe (AvitoTech/avibe, 8B, Apache-2.0) через vLLM, OpenAI-совместимый, с
    # вызовом инструментов.
    #   docker compose -f deploy/docker-compose.yml --profile core --profile avibe up -d
    #   .env: LLM_PROVIDER=openai_compat LLM_BASE_URL=http://avibe:8000/v1 LLM_MODEL=AvitoTech/avibe LLM_TIMEOUT_S=60
    # Нужны NVIDIA GPU (~23 ГБ видеопамяти в 16 бит; AVIBE_QUANTIZATION=fp8 уменьшает вдвое на Ada/Hopper) и среда
    # NVIDIA.
    image: vllm/vllm-openai:v0.10.1.1
    profiles: [avibe]
    command:
      - --model=AvitoTech/avibe
      - --served-model-name=AvitoTech/avibe
      - --max-model-len=${AVIBE_MAX_LEN:-8192}
      - --gpu-memory-utilization=0.90
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
      - ${AVIBE_QUANTIZATION_FLAG:---dtype=auto}
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf-cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ports:
      - "127.0.0.1:8000:8000"

  web:
    # Владелец C. SPA, которую раздаёт nginx. VITE_API_BASE_URL задаётся при СБОРКЕ: браузер обращается к ядру напрямую,
    # поэтому значение должно совпадать с портом ядра на хосте, а origin веба должен быть в CORS_ORIGINS ядра (по
    # умолчанию http://localhost:5173).
    build:
      context: ../web
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    profiles: [core, full]
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    ports:
      - "${WEB_HOST_PORT:-5173}:80"

  kafka:
    image: apache/kafka:3.9.0
    profiles: [full]
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  grafana:
    image: grafana/grafana:11.3.0
    profiles: [full]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ai-buddy.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  pgdata:
  ollama:
  hf-cache:

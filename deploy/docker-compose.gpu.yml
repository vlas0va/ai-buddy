# NVIDIA GPU для встроенной Ollama (A-Vibe отвечает за секунды, а не за минуту на CPU):
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.gpu.yml --profile core up -d --build --wait
# Нужны драйвер NVIDIA и NVIDIA Container Toolkit (Docker Desktop на Windows: бэкенд WSL2).
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

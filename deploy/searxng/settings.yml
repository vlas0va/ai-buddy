# Необязательный живой веб-поиск для агента (профиль compose websearch). Сюда доходят только общие технические вопросы,
# в замаскированном виде.
use_default_settings: true
server:
  limiter: false
  image_proxy: false
search:
  safe_search: 1
  formats: [html, json]   # агент читает /search?format=json

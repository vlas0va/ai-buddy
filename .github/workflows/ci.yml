name: ci

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      # Интеграционные тесты Go создают свежую базу на каждый тест (services/internal/platform/pgtest).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: buddy
          POSTGRES_PASSWORD: buddy
        ports: ['55432:5432']
        options: >-
          --health-cmd "pg_isready -U buddy" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://buddy:buddy@127.0.0.1:55432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false   # зависимости лежат в vendor
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/agent/requirements-dev.txt jsonschema==4.23.0   # jsonschema: scripts/check_contracts.py
      - run: make lint
      - run: make test
      - run: make coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/

  agent:
    # Владелец A: оценка на провайдере stub (ключ не нужен) и трассировка сценариев OpenSpec в тесты.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r services/agent/requirements-dev.txt
      - run: cd services/agent && ruff check . && ruff format --check .
      - run: python services/agent/tools/spec_trace.py
      - run: python eval/run_eval.py
      - run: docker build -f services/agent/Dockerfile -t aibuddy-agent .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: eval/reports/

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyyaml==6.0.2 jsonschema==4.23.0
      - run: python scripts/check_contracts.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx -y @redocly/cli@1 lint contracts/openapi.yaml --format=stylish

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: buddy
          POSTGRES_USER: buddy
          POSTGRES_PASSWORD: buddy
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U buddy -d buddy" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations in order
        env:
          PGPASSWORD: buddy
        run: for f in migrations/*.sql; do psql -h localhost -U buddy -d buddy -v ON_ERROR_STOP=1 -q -f "$f"; done

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/docker-compose.yml --profile core config -q
      - run: docker compose -f deploy/docker-compose.yml --profile full config -q

  web:
    # Владелец C: линтер, типы, юнит-тесты с порогом 80% строк из web/vite.config.ts, продакшен-сборка.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

  stack:
    # Путь эксперта (R27, R80): `make up` без .env и без ключа LLM, все сервисы здоровы, затем дымовая проверка S3.
    runs-on: ubuntu-latest
    needs: [compose]
    steps:
      - uses: actions/checkout@v4
      - name: make up (profile core) and wait for healthchecks
        # CI проверяет детерминированный путь: stub-LLM, без скачивания модели на 5 ГБ (эксперт по умолчанию получает
        # A-Vibe)
        env:
          LLM_DEFAULT_PROVIDER: stub
          AVIBE_PULL: "false"
        run: docker compose -f deploy/docker-compose.yml --profile core up -d --build --wait --wait-timeout 300
      - run: docker compose -f deploy/docker-compose.yml --profile core ps
      - name: smoke (S3 and S4 through core)
        run: |
          if [ -f scripts/smoke.sh ]; then bash scripts/smoke.sh http://localhost:8080; else echo "no scripts/smoke.sh yet"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: e2e (Playwright, one spec per declared scenario, stub LLM)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          WEB_URL=http://localhost:5173 API_URL=http://localhost:8080 npx playwright test
      - name: e2e report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --profile core logs --no-color --tail=200

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Закреплённый бинарник релиза запускается от пользователя раннера (образ контейнера работал с другим uid на
      # чекауте).
      - name: gitleaks v8.21.2
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --verbose

  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          if [ ! -d ./openspec ]; then
            echo "openspec directory not found, skipping"
            exit 0
          fi
          npx -y @fission-ai/openspec@1 validate --all

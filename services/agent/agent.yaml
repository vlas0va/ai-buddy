# Конфигурация агента AI-buddy — единственное место для промпта, модели, MCP-серверов и соответствия роль → инструменты
# (R53). Повторяет внутренний инструмент агентов Авито «промпт + MCP». ${VAR:-default} подставляется из окружения.
version: 1
name: ai-buddy

prompt:
  system: prompts/system.v1.md
  answer: prompts/answer.v1.md
  version: system.v1
  tone: ty                      # неформальное «ты», как в чек-листе стажёра Авито; без эмодзи

llm:
  provider: ${LLM_PROVIDER:-stub}          # stub | openai_compat
  base_url: ${LLM_BASE_URL:-}
  model: ${LLM_MODEL:-}
  timeout_s: ${LLM_TIMEOUT_S:-30}
  temperature: ${LLM_TEMPERATURE:-0.2}
  max_tokens: 700
  tool_calling: ${LLM_TOOL_CALLING:-false}  # разрешить LLM вызывать инструменты ЧТЕНИЯ роли пользователя (никогда инструменты записи)
  max_tool_iterations: 3
  fallback_to_stub: ${LLM_FALLBACK_TO_STUB:-true}
  no_think: ${LLM_NO_THINK:-true}           # модели с рассуждениями (A-Vibe/Qwen3): без <think> в ответах

embeddings:                     # необязательный гибридный поиск (BM25 + векторы, RRF)
  base_url: ${EMBEDDINGS_BASE_URL:-}
  model: ${EMBEDDINGS_MODEL:-}

retrieval:
  k: 4
  min_score: 1.2                # оценка BM25, ниже которой предлагается «не нашёл» + обращение к человеку (индекс в процессе)
  min_score_remote: 0.0         # mcp-kb возвращает ts_rank (0..1): там порогом служит проверка покрытия ниже
  min_coverage: 0.25            # взвешенная по IDF доля слов запроса, которые должны быть в документе
  team_boost: 1.25              # документы команды пользователя ранжируются выше (R02)
  stage_boost: 1.15             # документы, связанные с открытыми задачами плана пользователя, ранжируются выше (R15)

nlu:
  model_path: agent/models/intent_model.json
  min_confidence: 0.30

# Веб-поиск по общим техническим вопросам, которых нет в базе знаний (git, Docker, SQL …): из агента уходит только
# замаскированный вопрос, результаты — внешние источники («Внешний источник»). curated — список официальной
# документации, работает без сети; searxng — живой поиск через экземпляр SearXNG (WEB_SEARCH_URL, профиль compose
# websearch); off — выключено.
web_search:
  provider: ${WEB_SEARCH_PROVIDER:-curated}
  url: ${WEB_SEARCH_URL:-}
  timeout_s: 4
  max_results: 3
  curated_path: fixtures/web_curated.yaml

# MCP-серверы (streamable HTTP, contracts/mcp-tools.md): B запускает все восемь в одном бинарнике по
# http://mcp-mocks:8100/mcp/<server>. Приоритет у MCP_<SERVER>_URL конкретного сервера; иначе MCP_BASE_URL +
# "/<server>"; иначе используется мок этого сервера в процессе (автономно/разработка/тесты или пока сервер B не
# реализовал свои инструменты).
mcp_servers:
  absence:   {url: "${MCP_ABSENCE_URL:-}",   timeout_s: 5}   # http://mcp-mocks:8100/mcp/absence
  approvals: {url: "${MCP_APPROVALS_URL:-}", timeout_s: 5}   # http://mcp-mocks:8100/mcp/approvals
  directory: {url: "${MCP_DIRECTORY_URL:-}", timeout_s: 5}   # http://mcp-mocks:8100/mcp/directory
  checklist: {url: "${MCP_CHECKLIST_URL:-}", timeout_s: 5}   # http://mcp-mocks:8100/mcp/checklist
  access:    {url: "${MCP_ACCESS_URL:-}",    timeout_s: 5}   # http://mcp-mocks:8100/mcp/access
  kb:        {url: "${MCP_KB_URL:-}",        timeout_s: 5}   # http://mcp-mocks:8100/mcp/kb
  trips:     {url: "${MCP_TRIPS_URL:-}",     timeout_s: 5}   # http://mcp-mocks:8100/mcp/trips
  consents:  {url: "${MCP_CONSENTS_URL:-}",  timeout_s: 5}   # http://mcp-mocks:8100/mcp/consents

roles: [intern, mentor, lead, hrbp, alumni, hr_admin]

# Роль → инструменты, повторяет "roles" в contracts/schemas/*.json. LLM предлагаются только инструменты ЧТЕНИЯ роли
# вызывающего; инструменты записи выполняются только в ходе подтверждения после нажатия пользователем «Отправить»
# (ADR-003). Инструментов для зарплаты, компенсаций, медицинских данных, найма и увольнения нет (R72).
tools:
  - name: absence.get_policy
    roles: [intern, mentor, lead]
    write: false
    description: Тестовая инструкция об оформлении отгула и других видов отсутствия (документ базы знаний).
    input_schema: {type: object, properties: {}}
  - name: absence.list_my_requests
    roles: [intern, mentor, lead]
    write: false
    description: Мои заявки на отсутствие (отгул, отпуск, отсутствие, декрет) и их статусы.
    input_schema: {type: object, properties: {status: {type: string, enum: [pending_approval, pending_hr, approved, rejected, cancelled]}}}
  - name: absence.get_request
    roles: [intern, mentor, lead]
    write: false
    description: Одна моя заявка на отсутствие по номеру ABS-xxxxxx.
    input_schema: {type: object, properties: {id: {type: string}}, required: [id]}
  - name: absence.validate_request
    roles: [intern, mentor, lead]
    write: false
    description: Проверить даты заявки на отсутствие (вид, будущее, лимит, пересечения, документы для декрета).
    input_schema:
      type: object
      properties:
        type: {type: string, enum: [day_off, vacation, absence, parental_leave]}
        start_date: {type: string, format: date}
        end_date: {type: string, format: date}
        exclude_id: {type: string}
      required: [type, start_date, end_date]
  - name: absence.create_request
    roles: [intern, mentor, lead]
    write: true
    proposal_kind: absence_request
  - name: absence.reschedule_request
    roles: [intern, mentor, lead]
    write: true
    proposal_kind: absence_reschedule
  - name: absence.cancel_request
    roles: [intern, mentor, lead]
    write: true
    proposal_kind: absence_cancel
  - name: approvals.list_pending
    roles: [lead, hr_admin]
    write: false
    description: Заявки, ожидающие моего согласования (руководитель — своей команды, HR-администратор — второй этап).
    input_schema: {type: object, properties: {}}
  - name: approvals.decide
    roles: [lead, hr_admin]
    write: true
    proposal_kind: approval_decision
  - name: directory.whoami
    roles: [intern, mentor, lead, hrbp, alumni, hr_admin]
    write: false
    description: Кто я — имя, роль, команда, текущий этап стажировки.
    input_schema: {type: object, properties: {}}
  - name: directory.get_my_contacts
    roles: [intern, mentor, lead, hrbp, alumni, hr_admin]
    write: false
    description: Мои контакты — наставник, руководитель, HR BP, куратор стажировки и с чем к ним идти.
    input_schema: {type: object, properties: {}}
  - name: checklist.get_plan_template
    roles: [intern, mentor, lead, hrbp, alumni, hr_admin]
    write: false
    description: Шаблон плана адаптации по чек-листу (пункты CL-xx, периоды, шаги).
    input_schema: {type: object, properties: {role: {type: string, enum: [intern, mentor]}}, required: [role]}
  - name: access.list_required
    roles: [intern, mentor]
    write: false
    description: Доступы, нужные в моей команде, со статусами (Confluence, Jira, Bitbucket, пространство).
    input_schema: {type: object, properties: {}}
  - name: access.list_my_access
    roles: [intern, mentor]
    write: false
    description: Мои доступы и заявки на доступ со статусами.
    input_schema: {type: object, properties: {}}
  - name: access.list_team_channels
    roles: [intern, mentor]
    write: false
    description: Каналы и чаты моей команды (название, назначение, закрытый ли).
    input_schema: {type: object, properties: {}}
  - name: access.request_access
    roles: [intern, mentor]
    write: true
    proposal_kind: access_request
  - name: kb.search
    roles: [intern, mentor, lead, hrbp, alumni, hr_admin]
    write: false
    description: Поиск по базе знаний (результаты уже отфильтрованы по правам роли и команды).
    input_schema: {type: object, properties: {query: {type: string}, k: {type: integer, minimum: 1, maximum: 10}}, required: [query]}
  - name: kb.get
    roles: [intern, mentor, lead, hrbp, alumni, hr_admin]
    write: false
    description: Один документ базы знаний по doc_id (тот же ACL, что у поиска); ответы наставника, добавленные в базу, тоже здесь.
    input_schema: {type: object, properties: {doc_id: {type: string}}, required: [doc_id]}
  - name: trips.get_policy
    roles: [intern, mentor, lead]
    write: false
    description: Правила командировок — офисы, срок подачи заявки, максимальная длительность.
    input_schema: {type: object, properties: {}}
  - name: trips.list_my_requests
    roles: [intern, mentor, lead]
    write: false
    description: Мои заявки на командировку и их статусы.
    input_schema: {type: object, properties: {}}
  - name: trips.validate_request
    roles: [intern, mentor, lead]
    write: false
    description: Проверить город, даты и цель командировки.
    input_schema:
      type: object
      properties: {city: {type: string}, start_date: {type: string, format: date}, end_date: {type: string, format: date}, purpose: {type: string}}
      required: [city, start_date, end_date, purpose]
  - name: trips.create_request
    roles: [intern, mentor, lead]
    write: true
    proposal_kind: trip_request
  - name: consents.list
    roles: [intern, mentor, lead, hrbp, alumni, hr_admin]
    write: false
    description: Мои согласия (персональные данные, NDA, фото, опросы) и их статусы.
    input_schema: {type: object, properties: {}}
  - name: consents.sign
    roles: [intern, mentor, lead, hrbp, alumni, hr_admin]
    write: true
    proposal_kind: consent

# Намерения, доступные каждой роли (feature flags из ядра могут выключать сценарии для команды, R55).
intents:
  absence:      {roles: [intern, mentor, lead], flag: scenario_s3}
  access:       {roles: [intern, mentor], flag: scenario_s4}
  channels:     {roles: [intern, mentor], flag: scenario_s4}
  plan:         {roles: [intern, mentor, lead, alumni], flag: scenario_s1}
  summary:      {roles: [intern, mentor], flag: scenario_s1}
  task_message: {roles: [intern], flag: scenario_s1}
  one_on_one:   {roles: [mentor, lead]}
  approvals:    {roles: [lead, hr_admin]}
  mentee:       {roles: [mentor, lead]}
  kb_question:  {roles: [intern, mentor, lead, hrbp, alumni, hr_admin], flag: scenario_s2}
  quiz:         {roles: [intern, alumni], flag: scenario_s2}
  quiz_answer:  {roles: [intern, alumni], flag: scenario_s2}
  code_review:  {roles: [intern, mentor, lead], flag: scenario_s2}
  troubleshoot: {roles: [intern, mentor, lead], flag: scenario_s2}
  learning:     {roles: [intern, mentor, lead, alumni], flag: scenario_s2}
  task_help:    {roles: [intern, mentor, lead, alumni], flag: scenario_s2}
  benefit:      {roles: [intern, mentor, lead, hrbp, alumni], flag: scenario_s2}
  trip:         {roles: [intern, mentor, lead]}
  consents:     {roles: [intern, mentor, lead, hrbp, alumni]}

<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-buddy · dev console</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2129; --muted:#6b7280; --line:#e5e7eb; --accent:#0a7cff; --ok:#16a34a; --warn:#b45309; --bad:#dc2626; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; gap:12px; align-items:center; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header b { font-size:16px; }
  select, button, input, textarea { font:inherit; }
  button { border:1px solid var(--line); background:var(--card); border-radius:8px; padding:6px 12px; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  main { display:grid; grid-template-columns: 1fr 360px; gap:16px; padding:16px; max-width:1300px; margin:0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  #chat { background:var(--card); border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; height:calc(100vh - 110px); min-height:480px; }
  #log { flex:1; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 12px; border-radius:12px; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#e8f1ff; }
  .bot { align-self:flex-start; background:#f3f4f6; }
  .status { color:var(--muted); font-size:13px; }
  .card { border:1px solid var(--line); border-radius:10px; padding:10px 12px; background:#fff; max-width:85%; }
  .card h4 { margin:0 0 6px; font-size:14px; }
  .badge { display:inline-block; font-size:12px; padding:1px 8px; border-radius:999px; background:#fff7e6; color:var(--warn); border:1px solid #fde3b0; margin-left:6px; }
  .chip { display:inline-block; font-size:13px; padding:2px 8px; border-radius:6px; background:#eef2ff; margin:2px 4px 2px 0; }
  .refusal { border-color:#fecaca; background:#fff5f5; }
  .error { border-color:#fecaca; }
  .result { border-color:#bbf7d0; background:#f0fdf4; }
  textarea { width:100%; min-height:70px; border:1px solid var(--line); border-radius:8px; padding:8px; }
  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  form input { flex:1; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
  aside { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; height:calc(100vh - 110px); overflow:auto; }
  .task { display:flex; justify-content:space-between; gap:8px; padding:6px 0; border-bottom:1px dashed var(--line); font-size:14px; }
  .st { font-size:12px; padding:1px 6px; border-radius:6px; white-space:nowrap; cursor:pointer; }
  .st.done { background:#dcfce7; } .st.in_progress { background:#e0f2fe; } .st.overdue { background:#fee2e2; } .st.not_started { background:#f3f4f6; } .st.waiting_approval { background:#fef3c7; }
  .muted { color:var(--muted); font-size:13px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
</style>
</head>
<body>
<header>
  <b>AI-buddy</b><span class="muted">dev console (AGENT_DEV_MODE) — имитирует core и web</span>
  <select id="login"></select><button id="enter" class="primary">Войти</button>
  <button id="reset">Сбросить данные</button><span id="who" class="muted"></span>
</header>
<main>
  <section id="chat">
    <div id="log"></div>
    <form id="f"><input id="q" placeholder="Например: хочу отгул в пятницу" autocomplete="off"><button class="primary">Отправить</button></form>
  </section>
  <aside><h3 style="margin:4px 0 8px">План адаптации</h3><div id="plan" class="muted">Войдите под тестовой учёткой.</div>
    <h3>Быстрые запросы</h3><div id="quick" class="row"></div></aside>
</main>
<script>
const $ = (s) => document.querySelector(s);
let token = null, ctx = null, session = "s-" + Math.random().toString(16).slice(2), history = [];
const QUICK = ["Что мне делать дальше?", "Как у нас проходит код-ревью?", "Хочу отгул в пятницу", "Какие доступы мне нужны?",
  "Какие каналы есть в команде?", "Кто мой куратор?", "Покажи отпуск коллеги", "Сколько я буду получать?", "Покажи заявки на согласование"];
const STATUS = {not_started:"не начато", in_progress:"в работе", waiting_approval:"ждёт согласования", done:"готово", overdue:"просрочено"};
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const add = (node) => { $("#log").appendChild(node); $("#log").scrollTop = 1e9; return node; };
async function api(path, body, method = "POST") {
  const r = await fetch(path, { method, headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) },
    body: body ? JSON.stringify(body) : undefined });
  const data = await r.json(); if (!r.ok) throw data.error || data; return data;
}
async function loadUsers() {
  const users = await (await fetch("/dev/users")).json();
  $("#login").innerHTML = users.map(u => `<option value="${u.login}">${u.name} — ${u.role}, ${u.team_id}</option>`).join("");
  QUICK.forEach(q => { const b = el("button", "", q); b.onclick = () => send(q); $("#quick").appendChild(b); });
}
function renderPlan() {
  const tasks = (ctx && ctx.plan && ctx.plan.tasks) || [];
  if (!tasks.length) { $("#plan").textContent = "У этой роли нет плана адаптации."; return; }
  $("#plan").innerHTML = "";
  tasks.forEach(t => {
    const row = el("div", "task"); row.appendChild(el("span", "", `${t.checklist_item_id} · ${t.title}${t.human_only ? " (с людьми)" : ""}`));
    const st = el("span", "st " + t.status, STATUS[t.status] || t.status); st.title = "Нажмите, чтобы отметить готово / вернуть";
    st.onclick = async () => { ctx = await api("/dev/plan/task", { checklist_item_id: t.checklist_item_id, status: t.status === "done" ? "in_progress" : "done" }); renderPlan(); };
    row.appendChild(st); $("#plan").appendChild(row);
  });
}
$("#enter").onclick = async () => {
  const d = await api("/dev/login", { login: $("#login").value }); token = d.token; ctx = d.user_context; history = [];
  session = "s-" + Math.random().toString(16).slice(2); $("#log").innerHTML = ""; $("#who").textContent = `${ctx.display_name} · ${ctx.role} · ${ctx.team_id}`;
  renderPlan(); add(el("div", "status", "Вы вошли. Спросите что-нибудь или нажмите быстрый запрос."));
};
$("#reset").onclick = async () => { await api("/dev/reset", {}); if (token) { ctx = await api("/dev/context", null, "GET"); renderPlan(); } add(el("div", "status", "Данные имитаций сброшены.")); };
$("#f").onsubmit = (e) => { e.preventDefault(); const q = $("#q").value.trim(); if (q) { $("#q").value = ""; send(q); } };

async function send(text) {
  if (!token) { alert("Сначала войдите"); return; }
  add(el("div", "msg user", text));
  const statusLine = add(el("div", "status", "…")); let bubble = null, answer = "";
  try {
    const r = await fetch("/v1/turn", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token },
      body: JSON.stringify({ session_id: session, message_id: "m-" + Date.now(), turn: { kind: "message", text }, user_context: ctx, history }) });
    if (!r.ok) throw (await r.json()).error;
    const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
    while (true) {
      const { value, done } = await reader.read(); if (done) break; buf += dec.decode(value, { stream: true });
      let i; while ((i = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, i); buf = buf.slice(i + 2);
        const name = (block.match(/^event: (.*)$/m) || [])[1]; const data = JSON.parse((block.match(/^data: (.*)$/m) || [])[1] || "null");
        if (name === "status") statusLine.textContent = data.text + "…";
        else if (name === "token") { if (!bubble) bubble = add(el("div", "msg bot", "")); answer += data.text; bubble.textContent = answer; }
        else render(name, data, text);
        if (name === "done") statusLine.textContent = `${data.intent} · ${data.provider} · ${data.latency_ms} мс · ${data.tool_calls.join(", ") || "без инструментов"}`;
        if (name === "error") statusLine.textContent = "Ошибка";
      }
    }
    history.push({ author: "user", text }, { author: "assistant", text: answer });
  } catch (err) { render("error", err || { message: "Сеть недоступна", retryable: true }, text); }
}
function render(name, d, original) {
  if (name === "sources") { const c = add(el("div", "card")); c.appendChild(el("h4", "", "Источники")); d.items.forEach(s => c.appendChild(el("span", "chip", s.title))); c.appendChild(el("span", "badge", "Тестовая инструкция прототипа")); }
  if (name === "action_proposal") proposalCard(d);
  if (name === "escalation_draft") { const c = add(el("div", "card")); c.appendChild(el("h4", "", `Черновик: ${d.to_name || d.to_role}`)); const ta = el("textarea"); ta.value = d.text; c.appendChild(ta);
    const b = el("button", "primary", "Отправить"); b.onclick = () => { b.disabled = true; b.textContent = "Отправлено (в прототипе — POST /api/escalations в core)"; }; const row = el("div", "row"); row.appendChild(b); c.appendChild(row); }
  if (name === "next_step") { const c = add(el("div", "card")); c.appendChild(el("h4", "", "Следующий шаг")); c.appendChild(el("div", "", d.title)); const b = el("button", "primary", d.cta.label); b.onclick = () => send(d.cta.message); const row = el("div", "row"); row.appendChild(b); c.appendChild(row); }
  if (name === "refusal") { const c = add(el("div", "card refusal")); c.appendChild(el("h4", "", "Не могу помочь с этим")); c.appendChild(el("div", "muted", `причина: ${d.reason}${d.redirect_name ? " · обратись: " + d.redirect_name : ""}`)); }
  if (name === "error") { const c = add(el("div", "card error")); c.appendChild(el("h4", "", "Ошибка")); c.appendChild(el("div", "", d.message || "Ошибка")); if (d.retryable !== false && original) { const b = el("button", "", "Повторить"); b.onclick = () => send(original); c.appendChild(b); } }
}
async function streamTurn(body, onEvent) {
  const r = await fetch("/v1/turn", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: JSON.stringify(body) });
  if (!r.ok) throw (await r.json()).error;
  const reader = r.body.getReader(), dec = new TextDecoder(); let buf = "";
  while (true) { const { value, done } = await reader.read(); if (done) break; buf += dec.decode(value, { stream: true });
    let i; while ((i = buf.indexOf("\n\n")) >= 0) { const block = buf.slice(0, i); buf = buf.slice(i + 2);
      onEvent((block.match(/^event: (.*)$/m) || [])[1], JSON.parse((block.match(/^data: (.*)$/m) || [])[1] || "null")); } }
}
function proposalCard(p) {
  const c = add(el("div", "card")); c.appendChild(el("h4", "", p.title || p.summary));
  const d = (p.draft && p.draft.display) || {};
  const lines = [p.summary]; if (d.approver_display_name) lines.push("согласующий: " + d.approver_display_name); if (d.elevated) lines.push("повышенные права");
  c.appendChild(el("div", "muted", lines.join(" · ")));
  const row = el("div", "row"); const ok = el("button", "primary", "Отправить"); const cancel = el("button", "", "Отменить");
  ok.onclick = async () => {
    ok.disabled = true; ok.textContent = "Отправляю…";
    try {
      const { confirmation_token } = await api("/dev/confirm", { proposal: p });   // core does this in production
      let result = null, error = null;
      await streamTurn({ session_id: session, turn: { kind: "confirm", proposal_id: p.proposal_id, draft: p.draft, confirmation_token }, user_context: ctx },
        (name, data) => { if (name === "tool_result") result = data; if (name === "error") error = data; });
      if (error) throw error;
      row.remove(); const res = add(el("div", "card result")); res.appendChild(el("h4", "", `${result.summary} — ${result.status_label}`));
      res.appendChild(el("div", "", `Номер: ${result.external_id}${result.approver_display_name ? " · согласующий: " + result.approver_display_name : ""}${result.replayed ? " · повтор без дубля" : ""}`));
      if (result.followup) res.appendChild(el("div", "muted", result.followup));
      ctx = await api("/dev/context", null, "GET"); renderPlan();
    } catch (e) { ok.disabled = false; ok.textContent = "Повторить"; render("error", e, null); }
  };
  cancel.onclick = () => { row.remove(); c.appendChild(el("div", "muted", "Отменено")); };
  row.appendChild(ok); row.appendChild(cancel); c.appendChild(row);
}
loadUsers();
</script>
</body>
</html>
